<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Scores Page</title>
    <style>
       
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        color: #333;
    }

  

    input {
        padding: 8px;
        margin: 0 8px 12px 0;
        border: 1px solid #999;
    }

    input:focus {
        border-color: #007bff;
    }

    button {
        padding: 8px 16px;
        background-color: #222;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background-color: #444;
    }

    #status {
        margin-top: 10px;
        font-size: 14px;
    }
    </style>
</head>
<body>
    <h1>High Scores</h1>
    <button id="logoutBtn">Logout</button>

    <form id="scoreForm">
        <input type="text" id="screenname" placeholder="Screen name.." required/><br>
        <input type="text" id="firstname" placeholder="First name.." required/><br>
        <input type="text" id="lastname" placeholder="Last name.." required/><br>
        <input type="text" id="date" placeholder="Date.." required/><br>
        <input type="number" id="score" placeholder="Score.." min="0" required/><br>
        <input type="number" id="wins" placeholder="Wins.." min="0" required/><br>
        <button type="submit">Submit New User</button>
    </form>
    <button id="winBtn">Top Wins</button>

    <p id="status"></p>

    <ol id="scoreList"></ol>

    <script src="js/fetchscores.js"></script>
</body>
</html>
