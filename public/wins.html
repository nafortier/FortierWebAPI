<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Scores Page</title>
    <style>
    
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        color: #333;
    }

   

    #status {
        font-size: 14px;
        margin: 10px 0;
    }

   
   


    #winList li {
        list-style-position: inside; 
        padding: 10px;
       
    }

    #winList li:last-child {
        border-bottom: none;
    }

 
    button {
        padding: 8px 16px;
        background-color: #222;
        color: #fff;
        border: none;
        cursor: pointer;
        margin-bottom: 10px;
    }

    button:hover {
        background-color: #444;
    }
    </style>
</head>
<body>
    <h1>Top Wins</h1>
    
    <button id="backBtn">Back</button>

    <p id="status"></p>

    <ol id="winList"></ol>

    <script src="js/fetchwins.js"></script>
</body>
</html>
